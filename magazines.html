<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazines - Sim Racing Guide</title>
    <style>

@media (max-width: 768px) {
    h1 {
        font-size: 2rem;
    }

    .container {
        padding: 20px 10px;
    }

    .mag-info h3 {
        font-size: 1.2rem;
    }

    .mag-info p {
        font-size: 0.9rem;
    }
}


        body {
            margin: 0;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px 0;
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid #333;
        }

        .nav-item {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .nav-item:hover { color: #00ffff; }

        .container {
            max-width: 1200px;
            padding: 50px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 0 0 15px #00ffff;
        }

        /* The Grid for your Magazines */
        .magazine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            width: 100%;
        }

        .mag-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.4s;
            cursor: pointer;
        }

        .mag-card:hover {
            transform: translateY(-10px);
            border-color: #00ffff;
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.2);
        }

        .mag-thumb {
            width: 100%;
            height: 350px;
            background: #222; /* Placeholder for your cover image */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #444;
        }

        .mag-info {
            padding: 20px;
        }

        .btn-download {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #00ffff;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
    <a href="index.html" class="nav-item">Home</a>
    <a href="magazines.html" class="nav-item">Magazines</a>
    <a href="source-files.html" class="nav-item">Project Files</a>
</nav>

    <div class="container">
        <h1>Digital Magazines</h1>
        
        <div class="magazine-grid">
            <div class="mag-card">
                <div class="mag-thumb">
                    <img src="magazine_cover.jpeg" alt="Porsche Issue" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div class="mag-info">
                    <h3>The Porsche Special</h3>
                    <p>Technical insights into GT3 racing.</p>
                    <a href="page-1.pdf" class="btn-download" download>Download PDF</a>
                </div>
            </div>

</body>
</html>
